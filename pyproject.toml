[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notyet"
version = "0.1.0"
description = "A completion gate for AI coding agents: when the agent says it's done, check whether it is."
readme = "README.md"
requires-python = ">=3.11"  # tomllib
dependencies = []            # standard library only: it runs inside other projects' environments

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff", "pyright"]  # ruff/pyright: the static engine's tests

[project.scripts]
notyet = "notyet.cli:main"

[tool.setuptools.packages.find]
include = ["notyet*"]
