[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-intel"
version = "2.0.0"
description = "Change-impact analysis for git repos: what else a change needs, which tests to run, who calls it."
readme = "README.md"
requires-python = ">=3.10,<3.13"  # tree-sitter-languages has no wheels for 3.13 yet
dependencies = [
    "pydantic>=2.0.0",
    "networkx>=3.3",
    "tree-sitter==0.21.3",
    "tree-sitter-languages>=1.10.2",
    "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pyyaml>=6.0"]

[project.scripts]
codebase-intel = "codebase_intel.cli:main"

[tool.setuptools.packages.find]
include = ["codebase_intel*"]
