<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codebase-intel</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --border: #e2e2e0;
    --accent: #2f5bd3; --accent-text: #ffffff; --code-bg: #f1f1ee; --warn: #9a5b00; --warn-bg: #fff4e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151517; --panel: #1e1e21; --text: #ececee; --muted: #9a9aa2; --border: #2e2e33;
      --accent: #7c9cff; --accent-text: #0e0e10; --code-bg: #26262a; --warn: #f0b35a; --warn-bg: #33291a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  h1 { font-size: 20px; margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 4px; margin: 20px 0 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
               padding: 8px 12px; font: inherit; cursor: pointer; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select { font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
                  background: var(--panel); color: var(--text); }
  form input[type=text] { flex: 1 1 320px; min-width: 0; }
  button.go { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 6px;
              padding: 8px 16px; font: inherit; cursor: pointer; }
  button.go:disabled { opacity: .6; cursor: default; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-top: 12px; }
  .loc { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; overflow-wrap: anywhere; }
  pre { background: var(--code-bg); border-radius: 6px; padding: 10px; overflow-x: auto; margin: 8px 0 0;
        font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 8px 10px; margin-top: 10px; }
  .answer { white-space: pre-wrap; }
  .hidden { display: none; }
  .error { color: #d04040; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>codebase-intel</h1>
      <div class="muted">Search, definitions and impact analysis over your indexed repos</div>
    </div>
    <label class="muted">Repo <select id="repo" aria-label="Repository"></select></label>
  </header>

  <nav role="tablist">
    <button data-tab="search" class="active">Search</button>
    <button data-tab="definition">Definition</button>
    <button data-tab="impact">Impact</button>
    <button data-tab="ask">Ask</button>
  </nav>

  <section id="tab-search">
    <form data-action="search">
      <input type="text" name="q" placeholder="where are redirects followed?  or  get_netrc_auth" required>
      <button class="go">Search</button>
    </form>
    <div class="out"></div>
  </section>

  <section id="tab-definition" class="hidden">
    <form data-action="definition">
      <input type="text" name="q" placeholder="HTTPAdapter  or  Session.send" required>
      <button class="go">Find</button>
    </form>
    <div class="out"></div>
  </section>

  <section id="tab-impact" class="hidden">
    <form data-action="impact">
      <input type="text" name="q" placeholder="src/pkg/module.py  or  a symbol name" required>
      <button class="go">Analyze</button>
    </form>
    <div class="out"></div>
  </section>

  <section id="tab-ask" class="hidden">
    <form data-action="ask">
      <input type="text" name="q" placeholder="How does redirect handling work?" required>
      <button class="go">Ask</button>
    </form>
    <div class="muted" style="margin-top:6px">Uses the LLM set in <code>.env</code> (LLM_BACKEND). Repeated questions are served from cache.</div>
    <div class="out"></div>
  </section>
</main>

<script>
// Every value from the API is inserted with textContent (never innerHTML),
// so code snippets and answers can't inject markup.
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const c of children) node.append(c);
  return node;
};
const repo = () => $("#repo").value;

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : `HTTP ${res.status}`);
  return data;
}

function showError(out, err) {
  out.replaceChildren(el("div", {className: "card error", textContent: err.message}));
}

async function loadRepos() {
  const select = $("#repo");
  try {
    const {repos} = await api("/repos");
    select.replaceChildren(...repos.map(r => el("option", {value: r.repo_id, textContent: r.repo_id})));
    if (!repos.length) select.replaceChildren(el("option", {textContent: "no repos indexed", disabled: true}));
  } catch (e) {
    select.replaceChildren(el("option", {textContent: "unavailable", disabled: true}));
  }
}

function impactTable(items) {
  const rows = items.map(f => el("tr", {},
    el("td", {className: "num", textContent: f.confidence.toFixed(2)}),
    el("td", {className: "loc", textContent: f.file_path}),
    el("td", {className: "muted", textContent: f.reason})));
  return el("table", {}, el("tr", {}, el("th", {textContent: "Conf."}), el("th", {textContent: "File"}),
                              el("th", {textContent: "Why"})), ...rows);
}

const actions = {
  async search(q, out) {
    const {results} = await api("/search", {repo_id: repo(), query: q, top_k: 8});
    if (!results.length) return out.replaceChildren(el("div", {className: "card muted", textContent: "No results."}));
    out.replaceChildren(...results.map(r => el("div", {className: "card"},
      el("div", {className: "loc", textContent: `${r.file_path}  lines ${r.start_line}–${r.end_line}`}),
      el("pre", {textContent: r.snippet}))));
  },

  async definition(q, out) {
    const d = await api(`/definition?repo_id=${encodeURIComponent(repo())}&symbol=${encodeURIComponent(q)}`);
    const byFile = {};
    for (const loc of d.reference_locations) (byFile[loc.file_path] ??= []).push(loc.line);
    const uses = Object.entries(byFile).map(([f, lines]) => el("tr", {},
      el("td", {className: "loc", textContent: f}),
      el("td", {className: "muted", textContent: lines.slice(0, 12).join(", ") + (lines.length > 12 ? " …" : "")})));
    const parts = [el("div", {className: "card"},
      el("div", {textContent: `${d.qualified_name} (${d.kind ?? "symbol"})`}),
      el("div", {className: "loc muted", textContent: `${d.defining_file}  lines ${d.start_line}–${d.end_line ?? "?"}`}))];
    parts.push(el("div", {className: "card"},
      el("div", {className: "muted", textContent: `Used in ${uses.length} file(s)`}),
      uses.length ? el("table", {}, ...uses) : ""));
    if (d.other_definitions.length) parts.push(el("div", {className: "card muted",
      textContent: "Other matches: " + d.other_definitions.map(o => `${o.qualified_name} (${o.file_path}:${o.start_line})`).join(", ")}));
    out.replaceChildren(...parts);
  },

  async impact(q, out) {
    const r = await api("/impact", {repo_id: repo(), target: q});
    const all = [...r.high_confidence, ...r.medium_confidence, ...r.related];
    if (!all.length) return out.replaceChildren(el("div", {className: "card muted", textContent: "Nothing found for that target."}));
    const parts = [el("div", {className: "card"}, impactTable(all))];
    if (r.tests.length) parts.push(el("div", {className: "card"},
      el("div", {className: "muted", textContent: "Tests to run"}),
      el("div", {className: "loc", textContent: r.tests.map(t => t.file_path).join("\n"), style: "white-space:pre-wrap"})));
    out.replaceChildren(...parts);
  },

  async ask(q, out) {
    const answer = el("div", {className: "answer"});
    const card = el("div", {className: "card"}, answer);
    out.replaceChildren(card);
    const res = await fetch("/ask/stream", {method: "POST", headers: {"Content-Type": "application/json"},
                                           body: JSON.stringify({repo_id: repo(), question: q})});
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(typeof data.detail === "string" ? data.detail : `HTTP ${res.status}`);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      let nl;
      while ((nl = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, nl).trim();
        buffer = buffer.slice(nl + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === "delta") answer.textContent += ev.text;
        else if (ev.type === "error") throw new Error(ev.detail);
        else if (ev.type === "answer") {
          const r = ev.response;
          answer.textContent = r.answer;
          if (r.citations.length) card.append(el("div", {className: "loc muted",
            textContent: "Sources: " + r.citations.map(c => `${c.file_path}:${c.start_line}–${c.end_line}`).join("  ·  "),
            style: "margin-top:10px"}));
          if (r.uncertainty) card.append(el("div", {className: "warn", textContent: r.uncertainty}));
          card.append(el("div", {className: "muted", style: "margin-top:8px",
            textContent: r.cached ? "Answered from cache" : `${r.backend} / ${r.model}`}));
        }
      }
    }
  },
};

for (const button of document.querySelectorAll("nav button")) {
  button.addEventListener("click", () => {
    for (const b of document.querySelectorAll("nav button")) b.classList.toggle("active", b === button);
    for (const s of document.querySelectorAll("main > section")) s.classList.toggle("hidden", s.id !== `tab-${button.dataset.tab}`);
  });
}

for (const form of document.querySelectorAll("form[data-action]")) {
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = form.q.value.trim();
    const out = form.parentElement.querySelector(".out");
    const button = form.querySelector("button");
    if (!q || !repo()) return;
    button.disabled = true;
    out.replaceChildren(el("div", {className: "card muted", textContent: "Working…"}));
    try { await actions[form.dataset.action](q, out); }
    catch (err) { showError(out, err); }
    finally { button.disabled = false; }
  });
}

loadRepos();
</script>
</body>
</html>
