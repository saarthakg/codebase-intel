name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  eval:
    # Replays real changes from psf/requests and pallets/flask and fails on
    # regressions (floors in eval/thresholds.yaml). Everything runs locally.
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Clone benchmark repos at their pinned commits (full history)
        run: |
          for spec in "requests eval/requests_bench.yaml https://github.com/psf/requests" \
                      "flask eval/flask_bench.yaml https://github.com/pallets/flask"; do
            set -- $spec
            COMMIT=$(python -c "import yaml,sys; print(yaml.safe_load(open(sys.argv[1]))['repo_commit'])" "$2")
            git clone --quiet "$3" "$RUNNER_TEMP/$1-full"
            git -C "$RUNNER_TEMP/$1-full" checkout --quiet "$COMMIT"
          done
      - name: Static analysis (definitions, references, import graph)
        run: |
          python eval/run_eval.py --repo-id requests --ingest "$RUNNER_TEMP/requests-full" --out eval-out/requests.json
          python eval/run_eval.py --repo-id flask --bench eval/flask_bench.yaml --ingest "$RUNNER_TEMP/flask-full" --out eval-out/flask.json
      - name: Replay real changes and score the shipped model
        run: |
          for r in requests flask; do
            python eval/build_replay.py --git "$RUNNER_TEMP/$r-full" --repo-id $r --out eval-out/replay_$r.jsonl.gz
            python eval/score_replay.py eval-out/replay_$r.jsonl.gz --scorer shipped --out eval-out/replay_$r.json
          done
      - name: Symbol usages vs calls observed at runtime
        run: |
          python eval/run_usage_eval.py --repo-id requests --calls eval/requests_calls.json --out eval-out/usage_requests.json
          python eval/run_usage_eval.py --repo-id flask --calls eval/flask_calls.json --out eval-out/usage_flask.json
      - name: Check thresholds
        run: |
          python eval/check_thresholds.py requests=eval-out/requests.json flask=eval-out/flask.json \
                                          replay_requests=eval-out/replay_requests.json replay_flask=eval-out/replay_flask.json \
                                          usage_requests=eval-out/usage_requests.json usage_flask=eval-out/usage_flask.json
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-out/
